<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Đăng nhập quản trị · BangKeo Vũ Gia Phát</title>
  <link rel="icon" href="../images/logo.webp" type="image/png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin login-page">

  <main class="login-card">

    <div class="text-center mb-4">
      <img src="../images/logo.webp" alt="Logo VGP Win Win Tape" class="logo mb-3">
      <h1 class="h4 mb-1">Khu quản trị</h1>
      <p class="text-ink-3 fs-13 mb-0">BangKeo Vũ Gia Phát · VGP Win Win Tape</p>
    </div>

    <!-- Thông báo lý do bị đưa về đây (hết phiên, mất quyền, vừa đăng xuất) -->
    <div id="reasonBox"></div>

    <form id="loginForm" novalidate autocomplete="on">

      <div class="mb-3">
        <label class="form-label" for="email">Email quản trị</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-envelope text-ink-3"></i></span>
          <input class="form-control" id="email" name="email" type="email"
                 autocomplete="username" placeholder="admin@vugiaphat.vn" required>
        </div>
        <div class="invalid-feedback" id="err-email" role="alert"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-lock text-ink-3"></i></span>
          <input class="form-control" id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="••••••••" required>
          <button class="btn btn-light border" type="button" id="togglePass"
                  aria-label="Hiện mật khẩu" title="Hiện / ẩn mật khẩu">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback" id="err-password" role="alert"></div>
      </div>

      <div class="alert alert-danger py-2 fs-13 d-none" id="loginError" role="alert"></div>

      <button class="btn btn-primary w-100 py-2" type="submit" id="loginBtn">
        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập</span>
      </button>
    </form>

    <!-- Tài khoản mẫu — đây là đồ án, mật khẩu mẫu vốn đã ghi trong README
         và seed.sql, nên hiện ra đây cho tiện chấm bài. Hệ thống thật thì
         BỎ khối này đi. -->
    <div class="login-hint mt-4">
      <div class="fw-semibold mb-1"><i class="bi bi-info-circle me-1"></i>Tài khoản mẫu của đồ án</div>
      <div>Email: <code>admin@vugiaphat.vn</code> · Mật khẩu: <code>Admin@123</code></div>
      <div class="mt-1 text-ink-3">Tài khoản khách hàng đăng nhập được vào đây sẽ bị từ chối,
        vì cột <code>is_admin</code> của họ bằng 0.</div>
    </div>

    <div class="text-center mt-4">
      <a class="fs-13 text-decoration-none" href="../index.html">
        <i class="bi bi-arrow-left me-1"></i>Quay về website
      </a>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase SDK & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/auth.js"></script>

  <script>
  /* ==========================================================================
   * Xử lý form đăng nhập.
   *
   * Trang này phải tự mở CSDL vì bảng user nằm trong VuGiaPhat.db — không có
   * backend nào để hỏi. sql.js được nạp ngay khi trang mở (không đợi người
   * dùng bấm nút) để lúc bấm "Đăng nhập" là kiểm tra được ngay.
   * ========================================================================== */
  (function () {
    'use strict';

    var $ = Admin.$;
    var form = $('#loginForm');
    var btn = $('#loginBtn');
    var btnText = $('#loginBtnText');
    var errBox = $('#loginError');
    var dbReady = false;

    /* --- Nếu đã đăng nhập rồi thì vào thẳng, khỏi gõ lại --- */
    if (Admin.auth.session()) {
      location.replace('index.html');
      return;
    }

    /* --- Hiện lý do bị đưa về trang này --- */
    var reason = new URLSearchParams(location.search).get('ly_do');
    if (reason && Admin.auth.REASONS[reason]) {
      var tone = reason === 'dang-xuat' ? 'success' : 'warning';
      $('#reasonBox').innerHTML =
        '<div class="alert alert-' + tone + ' py-2 fs-13" role="status">' +
          '<i class="bi bi-info-circle me-1"></i>' +
          Admin.util.esc(Admin.auth.REASONS[reason]) +
        '</div>';
    }

    /* --- Không cần khởi tạo DB nữa --- */
    dbReady = true;
    $('#email').focus();

    function setBusy(on, text) {
      btn.disabled = on;
      btnText.innerHTML = on
        ? '<span class="spinner-border spinner-border-sm me-2"></span>' +
          Admin.util.esc(text || 'Đang xử lý…')
        : '<i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập';
    }

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.remove('d-none');
    }

    function clearError() {
      errBox.classList.add('d-none');
      ['email', 'password'].forEach(function (n) {
        Admin.ui.setFieldError(form.elements[n], '');
      });
    }

    /* --- Hiện / ẩn mật khẩu --- */
    $('#togglePass').addEventListener('click', function () {
      var input = $('#password');
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      this.innerHTML = '<i class="bi bi-eye' + (show ? '-slash' : '') + '"></i>';
      this.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      input.focus();
    });

    /* --- Gửi form --- */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearError();

      if (!dbReady) {
        showError('Cơ sở dữ liệu chưa sẵn sàng, thử lại sau giây lát.');
        return;
      }

      var R = Admin.ui.RULE;
      var ok = Admin.ui.validate(form, {
        email: [R.email('Email chưa đúng định dạng.')],
        password: [R.required('Vui lòng nhập mật khẩu.')]
      });
      if (!ok) return;

      setBusy(true, 'Đang kiểm tra…');

      Admin.auth.login(form.elements.email.value, form.elements.password.value)
        .then(function (user) {
          btnText.innerHTML = '<i class="bi bi-check-lg me-1"></i>Xin chào ' +
                              Admin.util.esc(user.fullname);
          location.replace('index.html');
        })
        .catch(function (err) {
          setBusy(false);
          showError(err.message);
          form.elements.password.value = '';
          form.elements.password.focus();
        });
    });
  })();
  </script>
</body>
</html>
